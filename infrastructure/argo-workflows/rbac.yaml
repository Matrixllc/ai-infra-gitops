apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-workflow-sa
  namespace: ai-infra
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ai-workflow-role
  namespace: ai-infra
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch", "create", "patch"]
  - apiGroups: ["argoproj.io"]
    resources: ["workflowtaskresults"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ai-workflow-binding
  namespace: ai-infra
subjects:
  - kind: ServiceAccount
    name: ai-workflow-sa
    namespace: ai-infra
roleRef:
  kind: Role
  name: ai-workflow-role
  apiGroup: rbac.authorization.k8s.io
