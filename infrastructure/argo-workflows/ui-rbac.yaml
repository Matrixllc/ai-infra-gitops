apiVersion: v1
kind: ServiceAccount
metadata:
  name: argo-ui-user
  namespace: ai-infra
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argo-ui-role
  namespace: ai-infra
rules:
  - apiGroups: ["argoproj.io"]
    resources:
      - workflows
      - workflowtemplates
    verbs: ["get", "list", "watch", "create"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argo-ui-binding
  namespace: ai-infra
subjects:
  - kind: ServiceAccount
    name: argo-ui-user
    namespace: ai-infra
roleRef:
  kind: Role
  name: argo-ui-role
  apiGroup: rbac.authorization.k8s.io
